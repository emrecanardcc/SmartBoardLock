name: Sınıf360 Mobile Store Build & Deploy (iOS & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Mobil Sürüm Etiketi (Örn: 2.1.2)'
        required: true
        default: '2.1.2'

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. ANDROID RELEASE AAB DERLEME
  # =========================================================================
  build-android:
    name: 🤖 Android AppBundle (.aab)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Keystore ve .env Dosyalarını Hazırla
        working-directory: mobile/TeacherMobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          fi
          if [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" > android/key.properties
          fi
          if [ -n "$MOBILE_ENV" ]; then
            echo "$MOBILE_ENV" > .env
          fi

      - name: Android Release AAB Derle
        working-directory: mobile/TeacherMobile
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Android Paketini Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: mobile/TeacherMobile/build/app/outputs/bundle/release/app-release.aab

  # =========================================================================
  # 2. IOS TESTFLIGHT BULUT DAĞITIMI (GitHub macOS Bulut Makinesi)
  # =========================================================================
  deploy-ios:
    name: 🍎 iOS TestFlight Otomatik Yükleme
    runs-on: macos-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: App Store API Anahtarını ve .env Hazırla
        working-directory: mobile/TeacherMobile
        env:
          APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_KEY_BASE64 }}
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
        run: |
          mkdir -p ~/.appstore
          if [ -n "$APP_STORE_KEY_BASE64" ]; then
            echo "$APP_STORE_KEY_BASE64" | base64 --decode > ~/.appstore/AuthKey_9CPAA97QY7.p8
          fi
          if [ -n "$MOBILE_ENV" ]; then
            echo "$MOBILE_ENV" > .env
          fi

      - name: Fastlane ile TestFlight'a Yükle
        if: env.APP_STORE_KEY_BASE64 != ''
        working-directory: mobile/TeacherMobile/ios
        env:
          APP_STORE_KEY_PATH: ~/.appstore/AuthKey_9CPAA97QY7.p8
          APP_STORE_KEY_ID: "9CPAA97QY7"
          APP_STORE_ISSUER_ID: "37cfcb1d-908a-4cba-922a-057b008cc424"
        run: |
          bundle install || gem install fastlane
          fastlane beta

  # =========================================================================
  # 3. GITHUB RELEASES AAB PAKETİ EKLEME
  # =========================================================================
  create-release:
    name: 🚀 GitHub Release Oluşturma
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Android Paketini İndir
        uses: actions/download-artifact@v4
        with:
          name: app-release.aab
          path: artifacts/

      - name: GitHub Release Yayınla
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/app-release.aab
          generate_release_notes: true
