name: Sınıf360 Production Release & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Yayınlanacak sürüm (Örn: 2.1.2)'
        required: true
        default: '2.1.2'

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. ANDROID DERLEME (Signed AAB)
  # =========================================================================
  build-android:
    name: 🤖 Android AppBundle (.aab)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Keystore ve .env Dosyalarını Hazırla
        working-directory: mobile/TeacherMobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          fi
          if [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" > android/key.properties
          fi
          if [ -n "$MOBILE_ENV" ]; then
            echo "$MOBILE_ENV" > .env
          fi

      - name: Android Release AAB Derle
        working-directory: mobile/TeacherMobile
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Android Paketini Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: mobile/TeacherMobile/build/app/outputs/bundle/release/app-release.aab

  # =========================================================================
  # 2. WEB ADMİN CANLIYA ALMA (Cloudflare Pages)
  # =========================================================================
  deploy-web:
    name: 🌐 Web Admin Cloudflare Canlı Yayın
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Web Admin Derle
        working-directory: web_admin
        run: |
          flutter pub get
          flutter build web --release

      - name: Cloudflare Pages Canlıya Al
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web_admin/build/web --project-name=sinif360-admin

  # =========================================================================
  # 3. WINDOWS TAHTA GÜNCELLEME PAKETİ
  # =========================================================================
  deploy-windows:
    name: 🖥️ Windows Kiosk & Watchdog Paketi
    runs-on: windows-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: .NET 8 Kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Windows Bileşenlerini Derle & Paketle
        run: |
          dotnet publish windows/KioskLockApp/KioskLockApp.csproj -c Release -r win-x64 --no-self-contained -o dist/v_publish
          dotnet publish windows/ConsoleApp1/WatchdogService.csproj -c Release -r win-x64 --no-self-contained -o dist/v_publish
          dotnet publish windows/TahtaRepair/TahtaRepair.csproj -c Release -r win-x64 --no-self-contained -o dist/v_publish
          dotnet publish windows/TahtaUpdater/TahtaUpdater.csproj -c Release -r win-x64 --no-self-contained -o dist/v_publish
          Compress-Archive -Path dist/v_publish/* -DestinationPath dist/TahtaUpdate.zip -Force

      - name: Windows Paketini Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: TahtaUpdate.zip
          path: dist/TahtaUpdate.zip

  # =========================================================================
  # 4. GITHUB RELEASES OLUŞTURMA
  # =========================================================================
  create-release:
    name: 🚀 GitHub Release & Dosya Ekleme
    needs: [build-android, deploy-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Android Paketini İndir
        uses: actions/download-artifact@v4
        with:
          name: app-release.aab
          path: artifacts/

      - name: Windows Paketini İndir
        uses: actions/download-artifact@v4
        with:
          name: TahtaUpdate.zip
          path: artifacts/

      - name: GitHub Release Yayınla
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/app-release.aab
            artifacts/TahtaUpdate.zip
          generate_release_notes: true
