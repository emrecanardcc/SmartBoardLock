server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    client_max_body_size 500M;

    # 1. Supabase Backend API & Realtime Proxy
    location /backend/ {
        proxy_pass http://172.17.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Kurulum ve İndirme Dosyaları (APK, EXE, ZIP, MSI)
    location ~* \.apk$ {
        root   /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Access-Control-Allow-Origin *;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location ~* \.(exe|msi)$ {
        root   /usr/share/nginx/html;
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin *;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location ~* \.zip$ {
        root   /usr/share/nginx/html;
        default_type application/zip;
        add_header Access-Control-Allow-Origin *;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # 3. Web Yönetim Paneli (/admin/)
    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 4. Kök dizin isteğini /admin/ sayfasına yönlendir
    location = / {
        return 302 /admin/;
    }

    # 5. Kalan statik dosyalar (hem root hem /admin araması)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin$uri /admin$uri/ /admin/index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
